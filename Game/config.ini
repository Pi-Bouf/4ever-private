; 4Story client + launcher configuration.
; Replaces the old Windows-registry settings. Lives next to the game/launcher exe.
; Values here mirror the CGameConfig defaults table (Lib/Own/GameConfig/GameConfig.cpp).
; The client also writes [Keys], [CustomUI] and [ChatInterface] here automatically on first run.

[Settings]
; --- display ---
WindowedMode=FALSE
UseShader=TRUE
ScreenX=1024
ScreenY=768
SwapEffect=0
PresentationInterval=0
Behavior=0
TextureDetail=1
; --- graphics quality ---
MapDETAIL=1
ObjDETAIL=1
MapSHADOW=1
ObjSHADOW=1
MapSFX=1
SfxDETAIL=1
DLIGHTMAP=1
FLIGHTMAP=1
FarIMAGE=1
OBJRange=1.0
; --- audio ---
MASTER=1
MainVolume=100
BGM=1
BGMVolume=100
SOUND=1
SFXVolume=100
; --- gameplay / UI ---
NpcNAME=1
MonNAME=1
PcNAME=1
AUTOHELP=1
TALKBOX=1
HUD=1
DENYWHI=0
DENYCOM=0
CONCHAT=0
MOUSECLICKMOVE=0
AUTOTARGETING=1
; --- fonts ---
Font=
FontSize=100
FontQuality=ANTIALIASED_QUALITY
FIRST=1

[Launcher]
; Patch configuration. Set 'address'/'port' to your patch server; 'directory' empty
; defaults to the launcher's own folder at runtime.
version=0
directory=
exe=TClient.exe
address=127.0.0.1
port=0
disclaimer=FALSE
PrePatchFirst=0
PrePatchAutoStart=0
